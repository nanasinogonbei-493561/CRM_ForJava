# =====================================================================
# 全環境共通の設定。Git で追跡される。
#
# 【原則】
#   1. 秘密（パスワード・鍵）は絶対に直書きせず ${ENV_VAR} で参照する。
#      実値は .env（追跡除外）にのみ置く。必要な変数は .env.example を参照。
#   2. 環境ごとに変わる値は ${VAR:デフォルト} 形式にし、開発環境で素直に
#      動く値をデフォルトにする。別環境は .env で上書きする。
#   3. OSIV や ddl-auto のような「全環境で同じであるべき設計判断」はここに
#      書いて共有する。個人の都合で変える値ではない。
#
# .env は spring.config.import で読み込まれ、import されたファイルの方が
# 優先されるため、ここで定義した同名プロパティを上書きできる。
# =====================================================================

spring.application.name=crm

# 環境変数ファイルの読み込み。optional: 付きなので .env が無くても起動は続行する
# （その場合 ${DB_PASSWORD} 等が未解決のまま渡り、接続時にエラーとして現れる）。
spring.config.import=optional:file:.env[.properties]


# ---------------------------------------------------------------------
# ログ
# ---------------------------------------------------------------------
logging.structured.format.console=logstash
logging.structured.format.file=logstash
logging.file.name=logs/app.log
logging.level.root=INFO
# 自作コードのみ DEBUG。運用環境で絞りたい場合は .env 側で上書きする。
logging.level.com.example.crm=DEBUG


# ---------------------------------------------------------------------
# データベース接続
# パスワードは環境変数 DB_PASSWORD から注入する。
# 注意: ${...} の中は「環境変数名／プロパティ名」であって、パスワードそのものではない。
# spring.datasource.* は @ConfigurationProperties 経由でバインドされ、未解決でも
# 例外を投げず文字列がそのまま渡るため、書き間違えると Access denied として初めて現れる。
# ---------------------------------------------------------------------
# 接続先はローカル開発をデフォルトにし、他環境は .env の DB_URL で差し替える。
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mydb}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ---------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------
# OSIV(Open Session In View)を明示的に無効化。
# 既定の true は「リクエストが終わるまでDBセッションを開いたまま」にする設定で、
# Viewを持たないREST APIでは接続を無駄に占有するだけ。既定のままだと起動時に
# 「Explicitly configure spring.jpa.open-in-view to disable this warning」とWARNが出る。
# 遅延ロードはトランザクション境界(=Service)の中で完結させる方針なので false でよい。
spring.jpa.open-in-view=false

# 開発時の可読性用。SQLログが不要な環境は .env で false に上書きする。
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# TODO: スキーマ管理の主体を決めて ddl-auto の値を確定する。
# 現状は動作を変えないため update のまま置いてある。
spring.jpa.hibernate.ddl-auto=update


# ---------------------------------------------------------------------
# Flyway（DBマイグレーション）
# FlywayのSQLはMySQL専用構文（AUTO_INCREMENT, ENGINE=InnoDB, COMMENT等）なのでH2では流さない
# ---------------------------------------------------------------------
spring.flyway.enabled=true


# ---------------------------------------------------------------------
# JWT認証の秘密鍵は環境変数にて、自動生成。
# 有効認証時間は２４時間。
# ---------------------------------------------------------------------
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000


# ---------------------------------------------------------------------
# 初期管理者ブートストラップ。
# POST /users を ADMIN 限定にしたため、最初の1人だけはAPI以外で作る必要がある。
# 値は .env（gitignore済み）から供給する。既定値を空にしてあるので、
# 未設定の環境では「何もしない」＝うっかり既定パスワードの管理者が生まれない。
# ---------------------------------------------------------------------
crm.bootstrap.admin-username=${ADMIN_USERNAME:}
crm.bootstrap.admin-email=${ADMIN_EMAIL:}
crm.bootstrap.admin-password=${ADMIN_PASSWORD:}
