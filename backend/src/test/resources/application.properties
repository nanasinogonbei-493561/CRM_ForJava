# =====================================================================
# テスト専用設定
# src/test/resources に application.properties を置くと、テスト実行時は
# main 側の application.properties の「代わりに」このファイルが読まれる
# （マージではなく置き換えなので、必要な設定はここに全部書く）
# =====================================================================

spring.application.name=crm

# 組み込み H2（インメモリ）。MODE=MySQL で MySQL に近い構文・挙動にする
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# スキーマはエンティティ定義から Hibernate が自動生成し、テスト終了時に破棄する
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# FlywayのSQLはMySQL専用構文（AUTO_INCREMENT, ENGINE=InnoDB, COMMENT等）なのでH2では流さない
spring.flyway.enabled=false

# JwtProperties が @Value("${jwt.secret}") で必須要求するため、テストでもダミー値が要る
# （無いと ApplicationContext の生成自体が失敗する）
# 実運用の鍵は main 側の ${JWT_SECRET} 環境変数から入るので、ここの値は検証専用
jwt.secret=test-only-dummy-secret-key-do-not-use-in-production-0123456789
jwt.expiration=86400000
