name: Secret Scanning with Betterleaks

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  secret-scan:
    name: Detect Exposed Credentials
    runs-on: ubuntu-latest
    # GITHUB_TOKEN に与える権限。リポジトリの既定が read のため
    # upload-sarif が要求する security-events: write が不足し、
    # "Resource not accessible by integration" で失敗していた。
    # 既定より広い権限もワークフロー側で宣言すれば付与される。
    # 必要なものだけを明示し、侵害時の被害範囲を絞る。
    permissions:
      contents: read          # actions/checkout がリポジトリを読むため
      security-events: write  # スキャン結果(SARIF)を Code Scanning へ送るため
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Betterleaks
        run: |
          curl -L -o betterleaks.tar.gz https://github.com/betterleaks/betterleaks/releases/download/v1.1.1/betterleaks_1.1.1_linux_x64.tar.gz
          tar -xzf betterleaks.tar.gz
          chmod +x betterleaks
          sudo mv betterleaks /usr/local/bin/
          betterleaks --version

      - name: Run credential scan
        run: |
          betterleaks git \
            --report-format sarif \
            --report-path betterleaks.sarif \
            --exit-code 1 \
            .

      - name: Upload findings to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: betterleaks.sarif