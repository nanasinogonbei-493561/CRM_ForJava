# =====================================================================
# Betterleaks 設定
# CI（.github/workflows/secret-scan.yml）は --config を渡していないため、
# リポジトリ直下のこのファイルが自動的に読み込まれる。
# =====================================================================

# 既定のルールセットを土台にする。
# これを書かないと下の allowlist だけが設定の全てになり、
# 検出ルールが 1 つも無い（＝何も検知しない）スキャナになってしまう。
[extend]
useDefault = true

# ---------------------------------------------------------------------
# 例外の書き方についての注意
#
# 複数の条件（paths / stopwords / commits）を並べると既定は OR 判定で、
# 「どれか 1 つでも当てはまれば除外」になる。paths だけを指定すると
# そのファイルの中身が丸ごと素通りするため、値まで絞りたい場合は
# condition = "AND" を明示すること。
# ---------------------------------------------------------------------

# 検知テストのために意図的に置いたダミートークン。
# b11eb2c で test.env を追加し 0c99987 で削除したが、Git の履歴からは
# 今も読み出せる。CI は fetch-depth: 0 で全履歴を走査するため除外する。
#
# 値は GitHub のトークンには使われない '@' を含む無効な形式で、
# 実在の資格情報ではないため失効(revoke)の必要はない。
#
# パス単位ではなくコミット単位で指定している。paths = ["test.env"] だと
# 将来 test.env に本物の値を置いた場合まで恒久的に見逃すが、
# コミット SHA なら過去の 1 点に固定され中身も変わらないため影響が最小。
[[allowlists]]
description = "検知テスト用のダミー GitHub トークン（b11eb2c の test.env）"
commits = ["b11eb2c6b90655c161585848c4697afb92baca23"]

# .env.example は必要な変数名を共有するためのテンプレートで、
# 値は常にプレースホルダの changeme。v1.8 系で追加された
# generic-password ルールがこれを拾うため除外する。
#
# condition = "AND" が要。これが無いと .env.example の中身が丸ごと
# 素通りし、.env をコピーして戻し忘れる事故（本物の値が
# .env.example に入る）を検知できなくなる。
# 「.env.example の中の changeme だけ」に絞ることで、
# 同じファイルに本物の値が入った場合は今までどおり検知される。
[[allowlists]]
description = ".env.example のプレースホルダ値"
condition = "AND"
paths = ['''^\.env\.example$''']
stopwords = ["changeme"]

# 過去にコミットされてしまったアプリログ。e91c7e4 で追跡対象から
# 外したが履歴には残る。Hibernate の接続エラー文
# "Access denied for user 'admin'@'localhost' (using password: YES)"
# の "password: YES" 部分を generic-password が値と誤認する。
#
# ここはパス単位で除外してよい。logs/ と *.log は .gitignore で
# 除外済みなので新しいログファイルはそもそもコミットできず、
# この例外が将来の本物の漏洩を隠す経路にならないため。
[[allowlists]]
description = "履歴に残るアプリログ（Hibernate のエラーメッセージの誤検知）"
paths = ['''^backend/logs/''', '''\.log$''']
