# =====================================================================
# Betterleaks 設定
# CI（.github/workflows/secret-scan.yml）は --config を渡していないため、
# リポジトリ直下のこのファイルが自動的に読み込まれる。
# =====================================================================

# 既定のルールセットを土台にする。
# これを書かないと下の allowlist だけが設定の全てになり、
# 検出ルールが 1 つも無い（＝何も検知しない）スキャナになってしまう。
[extend]
useDefault = true

# ---------------------------------------------------------------------
# 例外: 検知テストのために意図的に置いたダミートークン
#
# b11eb2c で test.env を追加し 0c99987 で削除したが、Git の履歴からは
# 今も読み出せる。CI は fetch-depth: 0 で全履歴を走査するため、
# ここで明示的に除外しておく。
#
# 値は ghp_@6KXcp9s... で、GitHub のトークンには使われない '@' を含む
# 無効な形式。実在の資格情報ではないので失効(revoke)は不要。
# （現行ルールの ghp_[0-9a-zA-Z]{36} にも一致しないが、CI は v1.1.1 に
#   ピン留めされておりルールセットが手元と異なるため、保険として残す）
#
# 除外はパス単位ではなくコミット単位で指定している。
# paths = ["test.env"] にすると、将来 test.env に本物の値を置いた場合まで
# 恒久的に見逃してしまう。コミット SHA なら過去の 1 点に固定され、
# 中身が後から変わることもないので影響範囲が最小で済む。
# ---------------------------------------------------------------------
[allowlist]
description = "検知テスト用のダミー GitHub トークン（b11eb2c の test.env）"
commits = ["b11eb2c6b90655c161585848c4697afb92baca23"]
